[servo fil_servo]
pin: Feeder:gpio22
maximum_servo_angle: 180
minimum_pulse_width: 0.001
maximum_pulse_width: 0.002
initial_angle: 90

[extruder1]
step_pin: Feeder:gpio18
dir_pin: !Feeder:gpio19
enable_pin: !Feeder:gpio17
microsteps: 16
rotation_distance: 23.0482278
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: Feeder:gpio7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: Feeder:gpio27
min_extrude_temp: -200
max_extrude_only_distance: 970.0
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: -200
max_temp: 250

