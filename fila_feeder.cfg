# This file contains common pin mappings for the BIGTREETECH SB2209 RP2040 V1.0
# Canbus board. To use this config, the firmware should be compiled for the
# RP2040 with "USB" or "CAN bus (on gpio4/gpio5)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.
[force_move]
enable_force_move: True

[mcu Feeder]
canbus_uuid: 97655486a448

[temperature_sensor Feeder_NTC]
sensor_type: Generic 3950
sensor_pin: Feeder:gpio28

[filament_switch_sensor filament_feeder]
switch_pin: ^Feeder:gpio24
pause_on_runout: False
insert_gcode:
    M117 Insert Detected
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150
    SET_SERVO SERVO=fil_servo ANGLE=17 # servo gripping filament
    ACTIVATE_EXTRUDER EXTRUDER=extruder1 # activates fila_feeder stepper
    _CLIENT_LINEAR_MOVE E=950 F=5000
    FORCE_MOVE STEPPER=extruder DISTANCE=20 VELOCITY=10 # forces toolhead to grab filament
    SET_SERVO SERVO=fil_servo ANGLE=45 # servo not gripping filament
    ACTIVATE_EXTRUDER EXTRUDER=extruder # activates toolhead extruder
    LOAD_FILAMENT
runout_gcode:
    

